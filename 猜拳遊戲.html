<html>
    <head>
        <title>猜拳遊戲</title>
        <style>
            p{
                font-size:25px;
            }
            button{
                font-size:25px;
                margin-right:20px;
                width:100px;
            }
        </style>    
    </head>

    <body>  
        <h1>歡迎來到猜拳遊戲</h1>

        <h2>來跟我猜拳吧！贏的人可以吃這隻雞腿！</h2>

        <p>請選擇 剪刀 石頭 布</p>

        <button onclick='
            playGame("剪刀");
        '>剪刀</button>
            
        <button onclick='
            playGame("石頭");
        '>石頭</button>

        <button onclick='
            playGame("布");
        '>布</button>
        

        <script>
            // let computerChoice = ""; //全域變數 可以在整個程式中使用

            function generateComputerChoice()
            {
                const random = Math.random()*3;

                console.log(random);

                if(0<=random && random < 1)
                {
                    computerChoice = "剪刀";
                }
                else if(1<=random && random < 2)
                {
                    computerChoice = "石頭";
                }
                else
                {
                    computerChoice = "布";
                }
                
                return computerChoice;
            }

            function playGame(userChoice)
            {
                const computerChoice = generateComputerChoice();
                if(userChoice === "剪刀")
                {
                    if(computerChoice === "剪刀")
                    {
                        // alert("你出" + userChoice + "\n" + "我出 " + computerChoice + "\n平局！");
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n平局！`);
                    }
                    else if(computerChoice === "石頭")
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n你輸了！`);
                    }
                    else
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n你贏了！`);
                    }
                }
                else if(userChoice === "石頭")
                {
                    if(computerChoice === "剪刀")
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n你贏了！`);
                    }
                    else if(computerChoice === "石頭")
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n平局！`);
                    }
                    else
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n你輸了！`);
                    }
                }
                else
                {
                    if(computerChoice === "剪刀")
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n你輸了！`);
                    }
                    else if(computerChoice === "石頭")
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n你贏了！`);
                    }
                    else
                    {
                        alert(`你出 ${userChoice}\n我出 ${computerChoice}\n平局！`);
                    }
                }
            }
        </script>
    </body>
