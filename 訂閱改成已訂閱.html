<html>
    <head>
        <title>訂閱改成已訂閱</title>
    </head>
    <body>
        <button onclick = "
            let buttonElment =  document.querySelector('button');

            if(buttonElment.innerHTML === '訂閱')
            {
                buttonElment.innerHTML = '已訂閱'
            }
            else
            {
                buttonElment.innerHTML = '訂閱'
            }
            console.log(buttonElment);
            console.log(buttonElment.innerHTML)

        ">訂閱</button>
        

        <script>
            

        </script>
    </body>
</html>
